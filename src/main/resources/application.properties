spring.application.name=LibraryAPI

spring.datasource.url=jdbc:h2:mem:library
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

api.security.token.secret=${JWT_SECRET:minha-chave-de-desenvolvimento-troque-em-producao-123456}

admin.default.nome=Administrador
admin.default.email=${ADMIN_EMAIL:admin@libraryapi.com}
admin.default.senha=${ADMIN_SENHA:admin123}